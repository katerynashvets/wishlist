<div class="w-full rounded-lg border-1 border-[#eff0fb] flex justify-between">
  <div class="flex gap-8">
    @if (img()) {
      <img [src]="img()" alt="image of collection" class="w-[200px] rounded-l-lg" />
    } @else {
      <img
        src="/images/collections/present.jpg"
        alt="image of collection"
        class="w-[200px] rounded-l-lg"
      />
    }
    <div class="flex flex-col py-5 gap-2">
      <div class="text-lg font-semibold">{{ name() }}</div>
      <div>{{ date() }}</div>
      <div class="border-1 border-[#de4981] rounded-xl w-fit px-4">{{ tag() }}</div>
    </div>
  </div>
  <div class="flex py-5 pr-5 gap-10 text-center items-center">
    <div>
      <span class="font-semibold text-xl">{{ numberOfGifts() }}</span>
      <div>gifts</div>
    </div>
    <div>
      <span class="font-semibold text-xl">{{ numberOfReserved() }}</span>
      <div>reserved</div>
    </div>
    <div>
      <span class="font-semibold text-xl">{{ numberOfPurchased() }}</span>
      <div>purchased</div>
    </div>
    <div class="cursor-pointer border-1 border-[#eff0fb] rounded-lg flex">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        height="24px"
        viewBox="0 -960 960 960"
        width="24px"
        fill="#1f1f1f"
        class="edit h-full py-3 w-[50%] px-2"
      >
        <path
          d="M200-200h57l391-391-57-57-391 391v57Zm-80 80v-170l528-527q12-11 26.5-17t30.5-6q16 0 31 6t26 18l55 56q12 11 17.5 26t5.5 30q0 16-5.5 30.5T817-647L290-120H120Zm640-584-56-56 56 56Zm-141 85-28-29 57 57-29-28Z"
        />
      </svg>
      <svg
        xmlns="http://www.w3.org/2000/svg"
        height="24px"
        viewBox="0 -960 960 960"
        width="24px"
        fill="#1f1f1f"
        class="delete h-full w-[50%] py-3 px-2"
      >
        <path
          d="m376-300 104-104 104 104 56-56-104-104 104-104-56-56-104 104-104-104-56 56 104 104-104 104 56 56Zm-96 180q-33 0-56.5-23.5T200-200v-520h-40v-80h200v-40h240v40h200v80h-40v520q0 33-23.5 56.5T680-120H280Zm400-600H280v520h400v-520Zm-400 0v520-520Z"
        />
      </svg>
    </div>
  </div>
</div>
