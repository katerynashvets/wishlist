<div class="bg-[#fefefe] rounded-xl py-5 px-12 w-80 flex flex-col gap-2">
  <div class="w-full flex justify-center">
    <ng-content select="[card-icon]"></ng-content>
  </div>
  <div class="text-2xl font-medium" [style.color]="isPink() ? '#de4981' : '#6d58d7'">
    {{ header() }}
  </div>
  <span>{{ description() }}</span>
</div>
